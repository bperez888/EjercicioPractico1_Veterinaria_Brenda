<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{plantilla/base :: estructura(~{::title}, ~{::main}, 'servicios')}">
    <head>
        <title th:text="#{menu.servicios}">Servicios</title>
    </head>
    <body>
        <main class="container py-5 flex-grow-1">
            <div class="row justify-content-center">
                <div class="col-lg-7">
                    <h1 class="vet-titulo mb-4"
                        th:text="${servicio.id == null} ? #{servicio.nuevo} : #{servicio.editar}">Servicio</h1>

                    <div class="card vet-tarjeta">
                        <div class="card-body p-4">
                            <form th:action="@{/servicios/guardar}" th:object="${servicio}" method="post" novalidate>
                                <input type="hidden" th:field="*{id}"/>

                                <div class="mb-3">
                                    <label for="nombre" class="form-label fw-semibold">[[#{servicio.nombre}]]</label>
                                    <input type="text" th:field="*{nombre}" class="form-control"
                                           th:errorclass="is-invalid" maxlength="100"/>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                                </div>

                                <div class="mb-3">
                                    <label for="tipoServicio.id" class="form-label fw-semibold">[[#{servicio.tipo}]]</label>
                                    <select th:field="*{tipoServicio.id}" class="form-select" th:errorclass="is-invalid">
                                        <option value="" th:text="#{servicio.tipo.seleccione}"></option>
                                        <option th:each="t : ${tipos}" th:value="${t.id}" th:text="${t.nombre}"></option>
                                    </select>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('tipoServicio.id')}"
                                         th:errors="*{tipoServicio.id}"></div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="tarifa" class="form-label fw-semibold">[[#{servicio.tarifa}]] ([[#{servicio.moneda}]])</label>
                                        <input type="number" step="0.01" min="0" th:field="*{tarifa}" class="form-control"
                                               th:errorclass="is-invalid"/>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('tarifa')}" th:errors="*{tarifa}"></div>
                                    </div>
                                    <div class="col-md-6 mb-4">
                                        <label for="duracionMinutos" class="form-label fw-semibold">[[#{servicio.duracion}]] ([[#{servicio.duracion.unidad}]])</label>
                                        <input type="number" step="1" min="1" th:field="*{duracionMinutos}" class="form-control"
                                               th:errorclass="is-invalid"/>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('duracionMinutos')}"
                                             th:errors="*{duracionMinutos}"></div>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end gap-2">
                                    <a th:href="@{/servicios}" class="btn btn-outline-secondary">
                                        <i class="fa-solid fa-xmark me-1"></i>[[#{accion.cancelar}]]
                                    </a>
                                    <button type="submit" class="btn btn-vet">
                                        <i class="fa-solid fa-floppy-disk me-1"></i>[[#{accion.guardar}]]
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
