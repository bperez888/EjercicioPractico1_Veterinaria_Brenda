<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{plantilla/base :: estructura(~{::title}, ~{::main}, 'citas')}">
    <head>
        <title th:text="#{menu.citas}">Citas</title>
    </head>
    <body>
        <main class="container py-5 flex-grow-1">
            <div class="mb-4">
                <h1 class="vet-titulo mb-1">[[#{cita.titulo}]]</h1>
                <p class="text-muted mb-0">[[#{cita.subtitulo}]]</p>
            </div>

            <div class="card vet-tarjeta">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="vet-encabezado-tabla">
                            <tr>
                                <th scope="col">[[#{cita.mascota}]]</th>
                                <th scope="col">[[#{cita.propietario}]]</th>
                                <th scope="col">[[#{cita.fecha}]]</th>
                                <th scope="col">[[#{cita.servicio}]]</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cita : ${citas}">
                                <td class="fw-semibold"><i class="fa-solid fa-paw me-2 vet-icono"></i>[[${cita.mascota}]]</td>
                                <td th:text="${cita.propietario}"></td>
                                <td th:text="${#temporals.format(cita.fecha, 'dd/MM/yyyy')}"></td>
                                <td><span class="badge rounded-pill vet-insignia" th:text="${cita.servicio.nombre}"></span></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(citas)}">
                                <td colspan="4" class="text-center text-muted py-4">[[#{campo.vacio}]]</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </body>
</html>
