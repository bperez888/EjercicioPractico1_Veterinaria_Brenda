<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{plantilla/base :: estructura(~{::title}, ~{::main}, 'tipos')}">
    <head>
        <title th:text="#{menu.tipos}">Tipos de Servicio</title>
    </head>
    <body>
        <main class="container py-5 flex-grow-1">
            <div class="row justify-content-center">
                <div class="col-lg-7">
                    <h1 class="vet-titulo mb-4"
                        th:text="${tipoServicio.id == null} ? #{tipo.nuevo} : #{tipo.editar}">Tipo de servicio</h1>

                    <div class="card vet-tarjeta">
                        <div class="card-body p-4">
                            <form th:action="@{/tipos-servicio/guardar}" th:object="${tipoServicio}" method="post" novalidate>
                                <input type="hidden" th:field="*{id}"/>

                                <div class="mb-3">
                                    <label for="nombre" class="form-label fw-semibold">[[#{tipo.nombre}]]</label>
                                    <input type="text" th:field="*{nombre}" class="form-control"
                                           th:errorclass="is-invalid" maxlength="100"/>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                                </div>

                                <div class="mb-4">
                                    <label for="resumen" class="form-label fw-semibold">[[#{tipo.resumen}]]</label>
                                    <textarea th:field="*{resumen}" class="form-control" rows="3"
                                              th:errorclass="is-invalid" maxlength="255"></textarea>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('resumen')}" th:errors="*{resumen}"></div>
                                </div>

                                <div class="d-flex justify-content-end gap-2">
                                    <a th:href="@{/tipos-servicio}" class="btn btn-outline-secondary">
                                        <i class="fa-solid fa-xmark me-1"></i>[[#{accion.cancelar}]]
                                    </a>
                                    <button type="submit" class="btn btn-vet">
                                        <i class="fa-solid fa-floppy-disk me-1"></i>[[#{accion.guardar}]]
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
