<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{plantilla/base :: estructura(~{::title}, ~{::main}, 'tipos')}">
    <head>
        <title th:text="#{menu.tipos}">Tipos de Servicio</title>
    </head>
    <body>
        <main class="container py-5 flex-grow-1">
            <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
                <div>
                    <h1 class="vet-titulo mb-1">[[#{tipo.titulo}]]</h1>
                    <p class="text-muted mb-0">[[#{tipo.subtitulo}]]</p>
                </div>
                <a th:href="@{/tipos-servicio/nuevo}" class="btn btn-vet">
                    <i class="fa-solid fa-plus me-1"></i>[[#{tipo.nuevo}]]
                </a>
            </div>

            <div class="card vet-tarjeta">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="vet-encabezado-tabla">
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col">[[#{tipo.nombre}]]</th>
                                <th scope="col">[[#{tipo.resumen}]]</th>
                                <th scope="col" class="text-center">[[#{tipo.cantidad}]]</th>
                                <th scope="col" class="text-end"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="tipo : ${tipos}">
                                <td th:text="${tipo.id}"></td>
                                <td class="fw-semibold" th:text="${tipo.nombre}"></td>
                                <td th:text="${tipo.resumen}"></td>
                                <td class="text-center">
                                    <span class="badge rounded-pill vet-insignia"
                                          th:text="${#lists.size(tipo.servicios)}"></span>
                                </td>
                                <td class="text-end text-nowrap">
                                    <a th:href="@{/tipos-servicio/editar/{id}(id=${tipo.id})}"
                                       class="btn btn-sm btn-outline-warning">
                                        <i class="fa-solid fa-pen me-1"></i>[[#{accion.editar}]]
                                    </a>
                                    <button type="button" class="btn btn-sm btn-outline-danger"
                                            data-bs-toggle="modal" data-bs-target="#modalConfirmarEliminar"
                                            th:data-id="${tipo.id}" th:data-nombre="${tipo.nombre}">
                                        <i class="fa-solid fa-trash me-1"></i>[[#{accion.eliminar}]]
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(tipos)}">
                                <td colspan="5" class="text-center text-muted py-4">[[#{campo.vacio}]]</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div th:replace="~{plantilla/componentes :: modalEliminar(@{/tipos-servicio/eliminar})}"></div>
        </main>
    </body>
</html>
